name: Lattice Health
description: 'Lattice Health is a Y Combinator (Spring 2026) healthcare company building AI governance
  as a managed service for hospitals. The platform sits beside an existing clinical stack and taps the
  HL7 and DICOM signals that deployed imaging and clinical AI models already emit, with no rip-and-replace
  integration, then continuously measures population drift (PSI), subgroup fairness disparity under HHS
  Section 1557, latency against target, and silent vendor model-update detection across every vendor
  model running in production. Rather than another dashboard, Lattice delivers a per-role signed PDF
  report each morning to IT directors, CMIO/CIO, and compliance officers, cryptographically signed with
  the institution''s own signing key so any recipient, including outside counsel or a regulator, can
  verify the artifact offline with standard open-source tooling and no Lattice account or infrastructure.
  Radiologist thumbs-up/thumbs-down feedback on AI results is aggregated at model level and folded into
  the next morning''s findings. The company positions itself around standards alignment (IHE UPS-RS work-list
  status, AI-Results and ERA classification, ONC HTI-1, FDA Predetermined Change Control Plan envelopes
  with automatic breach detection) and HIPAA-safe egress with a strict-mode PHI redactor, deployed on-premise
  or in the customer''s private cloud so PHI stays behind the hospital firewall. As of this profile Lattice
  Health publishes no public developer portal, API documentation, machine-readable API specification,
  SDKs, or pricing; it is a pre-public-API company tracked here as an AI governance and clinical AI oversight
  lead.'
